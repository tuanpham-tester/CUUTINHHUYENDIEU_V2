    const { useState, useEffect, useMemo, useCallback } = React;

    // =========================================================================

    const Icon = ({ name, className = "w-4 h-4", ...props }) => {

        check: <polyline points="20 6 9 17 4 12"/>,
        clipboardPaste: <><path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3a1 1 0 0 0-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2M16 4h2a2 2 0 0 1 2 2v2"/><path d="M11 14h10"/><path d="m17 10 4 4-4 4"/></>,

      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
          {icons[name]}
        </svg>

    };

    const PALACE_DEFINITIONS = [
      { index: 1, name: "Khảm (Bắc)", element: "Thủy", baguaNum: 1, color: "text-blue-400", border: "border-blue-500/30" },
      { index: 2, name: "Khôn (Tây Nam)", element: "Thổ", baguaNum: 2, color: "text-yellow-500", border: "border-yellow-600/30" },
      { index: 3, name: "Chấn (Đông)", element: "Mộc", baguaNum: 3, color: "text-emerald-400", border: "border-emerald-500/30" },
      { index: 4, name: "Tốn (Đông Nam)", element: "Mộc", baguaNum: 4, color: "text-teal-400", border: "border-teal-500/30" },
      { index: 5, name: "Trung Cung", element: "Thổ", baguaNum: 5, color: "text-amber-300", border: "border-amber-400/50" },
      { index: 6, name: "Càn (Tây Bắc)", element: "Kim", baguaNum: 6, color: "text-slate-300", border: "border-slate-400/30" },
      { index: 7, name: "Đoài (Tây)", element: "Kim", baguaNum: 7, color: "text-indigo-300", border: "border-indigo-400/30" },
      { index: 8, name: "Cấn (Đông Bắc)", element: "Thổ", baguaNum: 8, color: "text-amber-500", border: "border-amber-600/30" },
      { index: 9, name: "Ly (Nam)", element: "Hỏa", baguaNum: 9, color: "text-rose-400", border: "border-rose-500/30" }
    ];

    const STAR_CATALOG = {
      1: { id: 1, name: "Nhất Bạch Tham Lang", element: "Thủy", luckStatus: "Tiến Khí Cát Tinh", nature: "Dương Thủy" },
      2: { id: 2, name: "Nhị Hắc Cự Môn", element: "Thổ", luckStatus: "Sát Khí", nature: "Âm Thổ" },
      3: { id: 3, name: "Tam Bích Lộc Tồn", element: "Mộc", luckStatus: "Thoái Khí", nature: "Dương Mộc" },
      4: { id: 4, name: "Tứ Lục Văn Khúc", element: "Mộc", luckStatus: "Bình Ổn", nature: "Âm Mộc" },
      5: { id: 5, name: "Ngũ Hoàng Liêm Trinh", element: "Thổ", luckStatus: "Đại Sát / Mậu Kỷ", nature: "Dương Thổ" },
      6: { id: 6, name: "Lục Bạch Vũ Khúc", element: "Kim", luckStatus: "Cát Tinh Vượng Quan", nature: "Dương Kim" },
      7: { id: 7, name: "Thất Xích Phá Quân", element: "Kim", luckStatus: "Thoái Khí", nature: "Âm Kim" },
      8: { id: 8, name: "Bát Bạch Tả Phù", element: "Thổ", luckStatus: "Đương Lệnh Cát Tinh", nature: "Dương Thổ" },
      9: { id: 9, name: "Cửu Tử Hữu Bật", element: "Hỏa", luckStatus: "Sinh Khí Đương Vận 9", nature: "Âm Hỏa" }
    };

    const HEAVENLY_STEMS = ["Giáp", "Ất", "Bính", "Đinh", "Mậu", "Kỷ", "Canh", "Tân", "Nhâm", "Quý"];
    const EARTHLY_BRANCHES = ["Tý", "Sửu", "Dần", "Mão", "Thìn", "Tỵ", "Ngọ", "Mùi", "Thân", "Dậu", "Tuất", "Hợi"];
    const NAYIN_ELEMENTS = [
      "Hải Trung Kim", "Lư Trung Hỏa", "Đại Lâm Mộc", "Lộ Bàng Thổ", "Kiếm Phong Kim",
      "Sơn Đầu Hỏa", "Giản Hạ Thủy", "Thành Đầu Thổ", "Bạch Lạp Kim", "Dương Liễu Mộc",
      "Tuyền Trung Thủy", "Ốc Thượng Thổ", "Tích Lịch Hỏa", "Tùng Bách Mộc", "Trường Lưu Thủy",
      "Sa Trung Kim", "Sơn Hạ Hỏa", "Bình Địa Mộc", "Bích Thượng Thổ", "Kim Bạch Kim",
      "Phú Đăng Hỏa", "Thiên Hà Thủy", "Đại Dịch Thổ", "Thoa Xuyến Kim", "Tang Đố Mộc",
      "Đại Khê Thủy", "Sa Trung Thổ", "Thiên Thượng Hỏa", "Thạch Lựu Mộc", "Đại Hải Thủy"
    ];
    const XSMB_PROVINCES_BY_DAY = ["Thái Bình", "Hà Nội", "Quảng Ninh", "Bắc Ninh", "Hà Nội", "Hải Phòng", "Nam Định"];
    const VIETNAMESE_DAYS = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];

    // =========================================================================
    // 2. HÀM XỬ LÝ NGÀY THÁNG & THUẬT TOÁN PHI TINH LẠC THƯ
    // =========================================================================
    function toDateKey(dateObj) {
      return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, "0")}-${String(dateObj.getDate()).padStart(2, "0")}`;
    }

    function parseDateKey(dateKey) {
      const [y, m, d] = dateKey.split("-").map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDateVN(dateObj) {
      return `${String(dateObj.getDate()).padStart(2, "0")}/${String(dateObj.getMonth() + 1).padStart(2, "0")}/${dateObj.getFullYear()}`;
    }

    function getYesterdayDate(nowObj) {
      return new Date(nowObj.getFullYear(), nowObj.getMonth(), nowObj.getDate() - 1);
    }

    function calculateLuoShuChart(centerStarId, isDuongDon = true) {
      const flightOrder = [5, 6, 7, 8, 9, 1, 2, 3, 4];
      const chart = {};
      flightOrder.forEach((palaceId, step) => {
        const starId = isDuongDon
          ? ((centerStarId - 1 + step) % 9) + 1
          : ((centerStarId - 1 - step) % 9 + 9) % 9 + 1;
        chart[palaceId] = {
          palace: PALACE_DEFINITIONS.find(p => p.index === palaceId),
          star: STAR_CATALOG[starId],
          isCenter: palaceId === 5
        };
      });
      return chart;
    }

    function getSolarTermInfo(dateObj) {
      const m = dateObj.getMonth() + 1;
      const d = dateObj.getDate();
      const mmdd = m * 100 + d;
      const isDuongDon = mmdd >= 1221 || mmdd < 621;
      let termName = "Lập Đông";
      if (mmdd >= 1107 && mmdd < 1122) termName = "Lập Đông";
      else if (mmdd >= 1122 && mmdd < 1207) termName = "Tiểu Tuyết";
      else if (mmdd >= 1207 && mmdd < 1221) termName = "Đại Tuyết";
      else if (mmdd >= 1221 || mmdd < 105) termName = "Đông Chí";
      else if (mmdd >= 105 && mmdd < 120) termName = "Tiểu Hàn";
      else if (mmdd >= 120 && mmdd < 204) termName = "Đại Hàn";
      else if (mmdd >= 204 && mmdd < 219) termName = "Lập Xuân";
      else if (mmdd >= 219 && mmdd < 305) termName = "Vũ Thủy";
      else if (mmdd >= 305 && mmdd < 320) termName = "Kinh Trập";
      else if (mmdd >= 320 && mmdd < 404) termName = "Xuân Phân";
      else if (mmdd >= 404 && mmdd < 420) termName = "Thanh Minh";
      else if (mmdd >= 420 && mmdd < 505) termName = "Cốc Vũ";
      else if (mmdd >= 505 && mmdd < 521) termName = "Lập Hạ";
      else if (mmdd >= 521 && mmdd < 605) termName = "Tiểu Mãn";
      else if (mmdd >= 605 && mmdd < 621) termName = "Mang Chủng";
      else if (mmdd >= 621 && mmdd < 707) termName = "Hạ Chí";
      else if (mmdd >= 707 && mmdd < 722) termName = "Tiểu Thử";
      else if (mmdd >= 722 && mmdd < 807) termName = "Đại Thử";
      else if (mmdd >= 807 && mmdd < 823) termName = "Lập Thu";
      else if (mmdd >= 823 && mmdd < 907) termName = "Xử Thử";
      else if (mmdd >= 907 && mmdd < 923) termName = "Bạch Lộ";
      else if (mmdd >= 923 && mmdd < 1008) termName = "Thu Phân";
      else if (mmdd >= 1008 && mmdd < 1023) termName = "Hàn Lộ";
      else if (mmdd >= 1023 && mmdd < 1107) termName = "Sương Giáng";
      return { termName, isDuongDon, label: `${termName} (${isDuongDon ? "Dương Độn" : "Âm Độn"})` };
    }

    function getDayMetaphysics(targetDate) {
      const year = targetDate.getFullYear();
      const month = targetDate.getMonth();
      const day = targetDate.getDate();
      const anchorUtc = Date.UTC(2026, 10, 11);
      const targetUtc = Date.UTC(year, month, day);
      const diffDays = Math.round((targetUtc - anchorUtc) / 86400000);
      const cycle60Index = ((6 + diffDays) % 60 + 60) % 60;
      const stem = HEAVENLY_STEMS[cycle60Index % 10];
      const branch = EARTHLY_BRANCHES[cycle60Index % 12];
      const nayin = NAYIN_ELEMENTS[Math.floor(cycle60Index / 2)];
      const elementShort = nayin.split(" ").pop();
      const solarTermInfo = getSolarTermInfo(targetDate);
      const centerStar = solarTermInfo.isDuongDon
        ? ((2 - 1 + diffDays) % 9 + 9) % 9 + 1
        : ((2 - 1 - diffDays) % 9 + 9) % 9 + 1;

      return {
        diffDays, cycle60Index, stem, branch, nayin, elementShort,
        ganZhi: `${stem} ${branch} (${elementShort})`,
        solarTermInfo, centerStar, isDuongDon: solarTermInfo.isDuongDon,
        dayOfWeek: VIETNAMESE_DAYS[targetDate.getDay()],
        province: XSMB_PROVINCES_BY_DAY[targetDate.getDay()]
      };
    }

    // =========================================================================
    // 3. HÀM PHÂN TÍCH 27 GIẢI & DỰ BÁO CỬU TINH TẤT ĐỊNH
    // =========================================================================
    function parse27Prizes(prizes) {
      if (!prizes) return { prizeItems: [], flat27Numbers: [], totalPrizes: 0, loto2DList: [], special3D: "", headStats: Array.from({ length: 10 }, () => []), tailStats: Array.from({ length: 10 }, () => []) };
      const prizeItems = [
        { label: "Đặc Biệt", codes: [prizes.db] },
        { label: "Giải Nhất", codes: [prizes.g1] },
        { label: "Giải Nhì", codes: prizes.g2 || [] },
        { label: "Giải Ba", codes: prizes.g3 || [] },
        { label: "Giải Tư", codes: prizes.g4 || [] },
        { label: "Giải Năm", codes: prizes.g5 || [] },
        { label: "Giải Sáu", codes: prizes.g6 || [] },
        { label: "Giải Bảy", codes: prizes.g7 || [] },
      ];
      const flat27Numbers = [];
      const loto2DList = [];
      prizeItems.forEach(item => {
        (item.codes || []).forEach(code => {
          if (code) {
            flat27Numbers.push(code.trim());
            loto2DList.push(code.trim().slice(-2));
          }
        });
      });
      const special3D = prizes.db ? prizes.db.trim().slice(-3) : "";
      const headStats = Array.from({ length: 10 }, () => []);
      const tailStats = Array.from({ length: 10 }, () => []);
      loto2DList.forEach(num => {
        if (num.length === 2) {
          const head = parseInt(num[0], 10);
          const tail = parseInt(num[1], 10);
          if (!isNaN(head)) headStats[head].push(tail.toString());
          if (!isNaN(tail)) tailStats[tail].push(head.toString());
        }
      });
      return { prizeItems, flat27Numbers, totalPrizes: flat27Numbers.length, loto2DList, special3D, headStats, tailStats };
    }

    function isValid27Prizes(prizes) {
      if (!prizes) return false;
      return (
        typeof prizes.db === "string" && /^\d{5}$/.test(prizes.db) &&
        typeof prizes.g1 === "string" && /^\d{5}$/.test(prizes.g1) &&
        Array.isArray(prizes.g2) && prizes.g2.length === 2 && prizes.g2.every(c => /^\d{5}$/.test(c)) &&
        Array.isArray(prizes.g3) && prizes.g3.length === 6 && prizes.g3.every(c => /^\d{5}$/.test(c)) &&
        Array.isArray(prizes.g4) && prizes.g4.length === 4 && prizes.g4.every(c => /^\d{4}$/.test(c)) &&
        Array.isArray(prizes.g5) && prizes.g5.length === 6 && prizes.g5.every(c => /^\d{4}$/.test(c)) &&
        Array.isArray(prizes.g6) && prizes.g6.length === 3 && prizes.g6.every(c => /^\d{3}$/.test(c)) &&
        Array.isArray(prizes.g7) && prizes.g7.length === 4 && prizes.g7.every(c => /^\d{2}$/.test(c))
      );
    }

    function generateDailyCuuTinhForecast(targetDate, priorRealHistory = []) {
      const meta = getDayMetaphysics(targetDate);
      const { cycle60Index, stem, branch, nayin, ganZhi, solarTermInfo, centerStar, isDuongDon, dayOfWeek, province } = meta;
      const luoShu = calculateLuoShuChart(centerStar, isDuongDon);

      const freqMap = {};
      for (let i = 0; i < 100; i++) {
        freqMap[i.toString().padStart(2, "0")] = { count: 0, lastSeen: -1 };
      }
      priorRealHistory.forEach((period, pIdx) => {
        if (!period || !period.prizes) return;
        parse27Prizes(period.prizes).loto2DList.forEach(num => {
          if (freqMap[num]) {
            freqMap[num].count += 1;
            if (freqMap[num].lastSeen === -1) freqMap[num].lastSeen = pIdx;
          }
        });
      });

      const candidates = [];
      const auspiciousPalaceStars = Object.values(luoShu)
        .filter(c => c.star.id === 9 || c.star.id === 8 || c.star.id === 1 || c.star.id === 6)
        .map(c => c.palace.baguaNum);

      for (let i = 0; i < 100; i++) {
        const numStr = i.toString().padStart(2, "0");
        const d1 = parseInt(numStr[0], 10);
        const d2 = parseInt(numStr[1], 10);
        const cell = luoShu[(i % 9) + 1];
        const starBonus = (cell.star.id === 9 || cell.star.id === 8) ? 24 : (cell.star.id === 1 || cell.star.id === 6) ? 18 : 8;
        const palaceMatchBonus = (auspiciousPalaceStars.includes(d1) || auspiciousPalaceStars.includes(d2)) ? 10 : 0;
        const { count, lastSeen } = freqMap[numStr];
        const ganScore = lastSeen === -1 ? 4 : (lastSeen >= 1 && lastSeen <= 4 ? 14 : 6);
        const daySeedHash = ((cycle60Index * 17 + i * 31 + centerStar * 13) % 19);
        const score = 52 + starBonus + palaceMatchBonus + Math.min(18, count * 4) + ganScore + (daySeedHash / 10);
        candidates.push({ number: numStr, score, count, gan: lastSeen === -1 ? 8 : lastSeen, palaceName: cell.palace.name, starName: cell.star.name });
      }

      candidates.sort((a, b) => b.score - a.score);
      const btlObj = candidates[0];
      const btl = btlObj.number;

      let stlLead = candidates.find(c => c.number !== btl && c.number[0] !== c.number[1])?.number || "49";
      let stlRev = stlLead[1] + stlLead[0];
      if (stlRev === btl || stlLead === btl) { stlLead = "19"; stlRev = "91"; }
      const stl = [stlLead, stlRev];

      const excluded = new Set([btl, ...stl]);
      const ttl = candidates.filter(c => !excluded.has(c.number)).slice(0, 3).map(c => c.number);

      const clawDigits = Array.from(new Set([centerStar.toString(), "9", "8", ((centerStar + 4) % 9 + 1).toString()])).slice(0, 3);
      const threeClawSix = [
        `${clawDigits[0]}${btl}`, `${clawDigits[1]}${btl}`, `${clawDigits[2]}${btl}`,
        `${clawDigits[0]}${stl[0]}`, `${clawDigits[1]}${stl[0]}`, `${clawDigits[2]}${stl[1]}`
      ];

      const formattedDate = formatDateVN(targetDate);
      const centerStarObj = STAR_CATALOG[centerStar];

      return {
        dateKey: toDateKey(targetDate), date: formattedDate, dayOfWeek, province, ganZhi, nayin,
        solarTerm: solarTermInfo.label, centerStar, isDuongDon, btl, btlPalace: btlObj.palaceName,
        btlRecentCount: btlObj.count, stl, ttl, threeClawSix, clawDigits,
        cuuTinhScore: Number(Math.min(98.9, btlObj.score).toFixed(1)),

    // API 1: Chuẩn hóa dữ liệu từ GitHub Open Dataset (khiemdoan/vietnam-lottery-xsmb-analysis)
    function normalizeGithubJsonDataset(jsonData) {
      const parsedMap = {};
      if (!jsonData) return parsedMap;
      const records = Array.isArray(jsonData) ? jsonData : (Array.isArray(jsonData.data) ? jsonData.data : Object.values(jsonData));
      records.forEach((rec) => {
        if (!rec || typeof rec !== "object") return;
        const rawDate = String(rec.date || rec.ngay || rec.time || "");
        let dateKey = "";
        const isoMatch = rawDate.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
        const vnMatch = rawDate.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (isoMatch) {
          dateKey = `${isoMatch[1]}-${isoMatch[2].padStart(2, "0")}-${isoMatch[3].padStart(2, "0")}`;
        } else if (vnMatch) {
          dateKey = `${vnMatch[3]}-${vnMatch[2].padStart(2, "0")}-${vnMatch[1].padStart(2, "0")}`;
        }
        if (!dateKey) return;

        const toArr = (val, len) => {
          if (Array.isArray(val)) return val.map(v => String(v).trim().padStart(len, "0"));
          if (typeof val === "string") return val.match(new RegExp(`\\b\\d{${len}}\\b`, "g")) || [];
          return [];
        };
        const toSingle = (val, len) => {
          if (Array.isArray(val) && val.length > 0) return String(val[0]).trim().padStart(len, "0");
          if (typeof val === "string" || typeof val === "number") {
            const m = String(val).match(new RegExp(`\\d{${len}}`));
            return m ? m[0] : "";
          }
          return "";
        };

        const prizes = {
          db: toSingle(rec.special ?? rec.db ?? rec.DB, 5),
          g1: toSingle(rec.prize1 ?? rec.g1 ?? rec.G1, 5),
          g2: toArr(rec.prize2 ?? rec.g2 ?? rec.G2, 5),
          g3: toArr(rec.prize3 ?? rec.g3 ?? rec.G3, 5),
          g4: toArr(rec.prize4 ?? rec.g4 ?? rec.G4, 4),
          g5: toArr(rec.prize5 ?? rec.g5 ?? rec.G5, 4),
          g6: toArr(rec.prize6 ?? rec.g6 ?? rec.G6, 3),
          g7: toArr(rec.prize7 ?? rec.g7 ?? rec.G7, 2)
        };

        if (isValid27Prizes(prizes)) {
          parsedMap[dateKey] = { dateKey, prizes, sourceTag: "GitHub Open JSON API" };
        }
      });
      return parsedMap;
    }

    // API 2: Chuẩn hóa dữ liệu từ api-xsmb-today.onrender.com/api/v1
    function normalizeXsmbTodayApi(jsonData) {

      const payload = jsonData.results || jsonData.data || jsonData;
      const rawTime = String(jsonData.time || payload.time || payload.date || "");
      let dateKey = "";
      const vnMatch = rawTime.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
      const isoMatch = rawTime.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (vnMatch) {
        dateKey = `${vnMatch[3]}-${vnMatch[2].padStart(2, "0")}-${vnMatch[1].padStart(2, "0")}`;
      } else if (isoMatch) {
        dateKey = `${isoMatch[1]}-${isoMatch[2].padStart(2, "0")}-${isoMatch[3].padStart(2, "0")}`;
      }
      if (!dateKey) return parsedMap;

      const grabArr = (v, len) => {
        if (Array.isArray(v)) return v.map(x => String(x).trim().padStart(len, "0"));
        if (typeof v === "string") return v.match(new RegExp(`\\b\\d{${len}}\\b`, "g")) || [];
        return [];
      };
      const grabOne = (v, len) => {
        const arr = grabArr(v, len);
        return arr.length > 0 ? arr[0] : "";

      const prizes = {
        db: grabOne(payload.DB ?? payload.db ?? payload.special, 5),
        g1: grabOne(payload.G1 ?? payload.g1 ?? payload.prize1, 5),

          const g2Match = clean.match(/(?:^|\s)2\s*:\s*([\d\s-]+?)(?=\s*3\s*:)/);

          const g4Match = clean.match(/(?:^|\s)4\s*:\s*([\d\s-]+?)(?=\s*5\s*:)/);
          const g5Match = clean.match(/(?:^|\s)5\s*:\s*([\d\s-]+?)(?=\s*6\s*:)/);
          const g6Match = clean.match(/(?:^|\s)6\s*:\s*([\d\s-]+?)(?=\s*7\s*:)/);
          const g7Match = clean.match(/(?:^|\s)7\s*:\s*([\d\s-]+)/);

          if (dbMatch && g1Match && g2Match && g3Match && g4Match && g5Match && g6Match && g7Match) {
            const grabDigits = (raw, len) => raw.match(new RegExp(`\\b\\d{${len}}\\b`, "g")) || [];
            const prizes = {
              db: dbMatch[1],
              g1: g1Match[1],
              g2: grabDigits(g2Match[1], 5),
              g3: grabDigits(g3Match[1], 5),
              g4: grabDigits(g4Match[1], 4),
              g5: grabDigits(g5Match[1], 4),
              g6: grabDigits(g6Match[1], 3),
              g7: grabDigits(g7Match[1], 2),
            };
            if (isValid27Prizes(prizes)) {
              parsedMap[dateKey] = { dateKey, prizes, sourceTag: "RSS Feed Fallback API" };
            }
          }
        });
      } catch (e) {}
      return parsedMap;
    }

    function parseXsktHtmlPage(rawPayload) {
      const parsedMap = {};
      if (!rawPayload || typeof rawPayload !== "string") return parsedMap;
      const blocks = rawPayload.split(/(?=\d{1,2}\/\d{1,2}\/\d{4})/);
      blocks.forEach((block) => {
        const dm = block.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (!dm) return;
        const dateKey = `${dm[3]}-${dm[2].padStart(2, "0")}-${dm[1].padStart(2, "0")}`;
        const cleanedBlock = block.replace(/\d{1,2}\/\d{1,2}\/\d{4}/g, " ");
        const d5 = cleanedBlock.match(/\b\d{5}\b/g) || [];
        const d4 = cleanedBlock.match(/\b\d{4}\b/g) || [];
        const d3 = cleanedBlock.match(/\b\d{3}\b/g) || [];
        const d2 = cleanedBlock.match(/\b\d{2}\b/g) || [];
        if (d5.length >= 10 && d4.length >= 10 && d3.length >= 3 && d2.length >= 4) {
          const candidate = {
            db: d5[0], g1: d5[1], g2: d5.slice(2, 4), g3: d5.slice(4, 10),
            g4: d4.slice(0, 4), g5: d4.slice(4, 10), g6: d3.slice(0, 3), g7: d2.slice(0, 4),
          };
          if (isValid27Prizes(candidate)) {
            parsedMap[dateKey] = { dateKey, prizes: candidate, sourceTag: "Jina Reader Stream API" };
          }
        }
      });
      return parsedMap;
    }

    function parseManualPastedXskt(rawText, fallbackDateKey) {
      if (!rawText || !rawText.trim()) return null;
      let dateKey = fallbackDateKey;
      const dateMatch = rawText.match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
      if (dateMatch) dateKey = `${dateMatch[3]}-${dateMatch[2].padStart(2, "0")}-${dateMatch[1].padStart(2, "0")}`;

      const clean = rawText.replace(/\s+/g, " ").trim();
      const dbM = clean.match(/(?:ĐB|DB|Đặc\s*biệt)\s*:?\s*(\d{5})/i);
      const g1M = clean.match(/(?:G\.?1|Giải\s*nhất|1)\s*:?\s*(\d{5})/i);
      const g2M = clean.match(/(?:G\.?2|Giải\s*nhì|2)\s*:?\s*([\d\s-]+?)(?=\s*(?:G\.?3|Giải\s*ba|3)\s*:?)/i);
      const g3M = clean.match(/(?:G\.?3|Giải\s*ba|3)\s*:?\s*([\d\s-]+?)(?=\s*(?:G\.?4|Giải\s*tư|4)\s*:?)/i);
      const g4M = clean.match(/(?:G\.?4|Giải\s*tư|4)\s*:?\s*([\d\s-]+?)(?=\s*(?:G\.?5|Giải\s*năm|5)\s*:?)/i);
      const g5M = clean.match(/(?:G\.?5|Giải\s*năm|5)\s*:?\s*([\d\s-]+?)(?=\s*(?:G\.?6|Giải\s*sáu|6)\s*:?)/i);
      const g6M = clean.match(/(?:G\.?6|Giải\s*sáu|6)\s*:?\s*([\d\s-]+?)(?=\s*(?:G\.?7|Giải\s*bảy|7)\s*:?)/i);
      const g7M = clean.match(/(?:G\.?7|Giải\s*bảy|7)\s*:?\s*([\d\s-]+)/i);

      if (dbM && g1M && g2M && g3M && g4M && g5M && g6M && g7M) {
        const grab = (str, len) => (str.match(new RegExp(`\\b\\d{${len}}\\b`, "g")) || []);
        const candidate = { db: dbM[1], g1: g1M[1], g2: grab(g2M[1], 5), g3: grab(g3M[1], 5), g4: grab(g4M[1], 4), g5: grab(g5M[1], 4), g6: grab(g6M[1], 3), g7: grab(g7M[1], 2) };
        if (isValid27Prizes(candidate)) return { dateKey, prizes: candidate, sourceTag: 'Đồng bộ thủ công xskt.com.vn' };
      }

      const textWithoutDate = rawText.replace(/\d{1,2}[\/-]\d{1,2}[\/-]\d{4}/g, " ");
      const d5 = textWithoutDate.match(/\b\d{5}\b/g) || [];
      const d4 = textWithoutDate.match(/\b\d{4}\b/g) || [];
      const d3 = textWithoutDate.match(/\b\d{3}\b/g) || [];
      const d2 = textWithoutDate.match(/\b\d{2}\b/g) || [];

      if (d5.length >= 10 && d4.length >= 10 && d3.length >= 3 && d2.length >= 4) {
        const candidate = { db: d5[0], g1: d5[1], g2: d5.slice(2, 4), g3: d5.slice(4, 10), g4: d4.slice(0, 4), g5: d4.slice(4, 10), g6: d3.slice(0, 3), g7: d2.slice(0, 4) };
        if (isValid27Prizes(candidate)) return { dateKey, prizes: candidate, sourceTag: 'Đồng bộ từ bảng KQ xskt.com.vn' };
      }
      return null;
    }

    function verifyPredictionAgainstLive(forecast, prizes) {
      const analysis = parse27Prizes(prizes);
      const { loto2DList, special3D } = analysis;
      const countHits = (target) => loto2DList.filter(item => item === target.toString().padStart(2, '0')).length;
      const btl = forecast.btl;
      const btlHits = countHits(btl);
      const stlResults = (forecast.stl || []).map(num => ({ number: num, hits: countHits(num) }));
      const totalStlHits = stlResults.reduce((sum, item) => sum + item.hits, 0);
      const ttlResults = (forecast.ttl || []).map(num => ({ number: num, hits: countHits(num) }));
      const totalTtlHits = ttlResults.reduce((sum, item) => sum + item.hits, 0);
      const threeClawMatches = (forecast.threeClawSix || []).filter(code => code === special3D);
      const totalHits = btlHits + totalStlHits + totalTtlHits;
      const isWin = btlHits > 0 || totalStlHits > 0 || totalTtlHits > 0 || threeClawMatches.length > 0;
      return {
        analysis, isWin, totalHits,
        btl: { target: btl, hits: btlHits, isWin: btlHits > 0 },
        stl: { list: stlResults, totalHits: totalStlHits, isWin: totalStlHits > 0 },
        ttl: { list: ttlResults, totalHits: totalTtlHits, isWin: totalTtlHits > 0 },
        threeClaw: { list: forecast.threeClawSix || [], special3D, matches: threeClawMatches, isWin: threeClawMatches.length > 0 }
      };
    }

    const LIVE_CACHE_STORAGE_KEY = "xsmb_cuutinh_verified_live_v3";

    // =========================================================================
    // 6. COMPONENT CHÍNH CỦA ỨNG DỤNG
    // =========================================================================
    function App() {
      const [currentTime, setCurrentTime] = useState(() => new Date());
      const [liveCache, setLiveCache] = useState(() => {
        try { const saved = localStorage.getItem(LIVE_CACHE_STORAGE_KEY); return saved ? JSON.parse(saved) : {}; } catch (e) { return {}; }
      });

      const [selectedPeriodIndex, setSelectedPeriodIndex] = useState(0);
      const [activeTab, setActiveTab] = useState('cuuTinh');
      const [activeCycle, setActiveCycle] = useState(10);
      const [verifyWindow, setVerifyWindow] = useState(10);
      const [searchNumber, setSearchNumber] = useState('');
      const [isFetchingLive, setIsFetchingLive] = useState(false);
      const [showExplanationModal, setShowExplanationModal] = useState(false);
      const [showPasteModal, setShowPasteModal] = useState(false);
      const [pasteInput, setPasteInput] = useState('');
      const [pasteError, setPasteError] = useState('');
      const [copiedToday, setCopiedToday] = useState(false);

      // Đồng hồ thời gian thực & tự động Rollover 00:00 mỗi ngày
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const todayDateKey = toDateKey(currentTime);
      const yesterdayDateObj = useMemo(() => getYesterdayDate(currentTime), [todayDateKey]);
      const yesterdayDateKey = toDateKey(yesterdayDateObj);
      const yesterdayDateStr = formatDateVN(yesterdayDateObj);

      useEffect(() => { setSelectedPeriodIndex(0); }, [todayDateKey]);

      const historyData = useMemo(() => buildRealHistoryUpToYesterday(currentTime, liveCache), [todayDateKey, liveCache]);
      const latestPeriod = historyData[0];
      const isYesterdaySynced = Boolean(latestPeriod && latestPeriod.dateKey === yesterdayDateKey);

      const [liveSourceStatus, setLiveSourceStatus] = useState(() => ({
        type: 'loading',
        message: `Đang kết nối JSON API miễn phí để xác thực 27 giải đến kỳ (${yesterdayDateStr})...`,
        lastSync: `Mục tiêu T-1: ${yesterdayDateStr}`
      }));

      // Kiến trúc Zero-CORS JSON API Đa Nguồn Miễn Phí (GitHub Raw JSON + jsDelivr CDN + XSMB Today API + Jina Fallback)
      const fetchLiveFromXskt = useCallback(async () => {
        setIsFetchingLive(true);
        setLiveSourceStatus({
          type: 'loading',
          message: `Đang đồng bộ trực tiếp qua JSON API miễn phí (Zero-CORS) cho kỳ ${yesterdayDateStr}...`,
          lastSync: `Đang gọi JSON API đa nguồn`
        });

        const rssTarget = "https://xskt.com.vn/rss-feed/mien-bac-xsmb.rss";

        const apiEndpoints = [
          {
            name: "GitHub Open JSON API (CORS *)",
            url: "https://raw.githubusercontent.com/khiemdoan/vietnam-lottery-xsmb-analysis/main/data/xsmb.json",
            parser: (res) => res.json().then(normalizeGithubJsonDataset)
          },
          {
            name: "jsDelivr CDN JSON API (CORS *)",
            url: "https://cdn.jsdelivr.net/gh/khiemdoan/vietnam-lottery-xsmb-analysis@main/data/xsmb.json",
            parser: (res) => res.json().then(normalizeGithubJsonDataset)
          },
          {
            name: "XSMB Today Live JSON API (CORS *)",
            url: "https://api-xsmb-today.onrender.com/api/v1",
            parser: (res) => res.json().then(normalizeXsmbTodayApi)
          },
          {
            name: "Jina Reader RSS Stream API",
            url: `https://r.jina.ai/${rssTarget}`,
            parser: (res) => res.text().then(txt => {
              const xmlRes = parseXsktRssXml(txt);
              return Object.keys(xmlRes).length > 0 ? xmlRes : parseXsktHtmlPage(txt);
            })
          },
          {
            name: "AllOrigins JSON Proxy RSS",
            url: `https://api.allorigins.win/get?url=${encodeURIComponent(rssTarget)}`,
            parser: (res) => res.json().then(j => parseXsktRssXml(j?.contents || ""))
          }
        ];

        let mergedParsed = {};
        let activeApiName = "";

        // Gọi song song tất cả các API JSON miễn phí để đạt tốc độ phản hồi nhanh nhất
        const results = await Promise.allSettled(
          apiEndpoints.map(async (ep) => {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 7000);
            try {
              const res = await fetch(ep.url, { signal: controller.signal, cache: "no-store" });
              clearTimeout(timeoutId);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const dataMap = await ep.parser(res);
              if (Object.keys(dataMap).length > 0) {
                return { name: ep.name, dataMap };
              }
              throw new Error("Empty dataset");
            } catch (err) {
              clearTimeout(timeoutId);
              throw err;
            }
          })
        );

        results.forEach((r) => {
          if (r.status === "fulfilled" && r.value) {
            mergedParsed = { ...mergedParsed, ...r.value.dataMap };
            if (!activeApiName || r.value.dataMap[yesterdayDateKey]) {
              activeApiName = r.value.name;
            }
          }
        });

        if (Object.keys(mergedParsed).length > 0) {
          setLiveCache(prev => {
            const updated = { ...prev, ...mergedParsed };
            try { localStorage.setItem(LIVE_CACHE_STORAGE_KEY, JSON.stringify(updated)); } catch (e) {}
            return updated;
          });
        }

        const hasYesterdayNow = Boolean(
          mergedParsed[yesterdayDateKey] ||
          liveCache[yesterdayDateKey] ||
          VERIFIED_HISTORY_MAP[yesterdayDateKey]
        );
        setIsFetchingLive(false);
        setSelectedPeriodIndex(0);

        if (hasYesterdayNow) {
          const displayApi = activeApiName || "JSON API Chuẩn Xác Thực";
          setLiveSourceStatus({
            type: 'verified',
            message: `API JSON Đồng Bộ Thành Công • Chuẩn 27 Giải đến ${yesterdayDateStr} (${displayApi})`,
            lastSync: `Đã xác thực 27 giải đến ${yesterdayDateStr}`
          });
        } else {
          setLiveSourceStatus({
            type: 'pending_yesterday',
            message: `Đang chờ API cập nhật kỳ mới ${yesterdayDateStr} (Auto-Polling mỗi 30s). Bạn cũng có thể bấm "Dán KQ Live" để nạp ngay.`,
            lastSync: `Kỳ gần nhất hiện có: ${latestPeriod?.date || '15/11/2026'}`
          });
        }
      }, [yesterdayDateKey, yesterdayDateStr, liveCache, latestPeriod]);

      // Kích hoạt đồng bộ ngay khi khởi chạy hoặc chuyển ngày
      useEffect(() => { fetchLiveFromXskt(); }, [todayDateKey]);

      // Auto-Polling mỗi 30 giây khi thiếu kỳ T-1 hoặc đang trong khung giờ quay thưởng 18h14-18h38
      useEffect(() => {
        const autoPoll = setInterval(() => {
          const now = new Date();
          const mins = now.getHours() * 60 + now.getMinutes();
          const isDrawingWindow = mins >= 18 * 60 + 14 && mins <= 18 * 60 + 38;

          if (!isFetchingLive && (!isYesterdaySynced || isDrawingWindow)) {
            fetchLiveFromXskt();
          }
        }, 30000);

        return () => clearInterval(autoPoll);
      }, [isYesterdaySynced, isFetchingLive, fetchLiveFromXskt]);

      const handleManualPasteSubmit = () => {
        setPasteError("");
        const parsed = parseManualPastedXskt(pasteInput, yesterdayDateKey);
        if (!parsed) {
          setPasteError("Không nhận diện đủ 27 giải XSMB hợp lệ. Hãy copy toàn bộ bảng kết quả từ ĐB đến Giải 7 trên xskt.com.vn/xsmb và dán vào đây.");
          return;
        }
        setLiveCache(prev => {
          const updated = { ...prev, [parsed.dateKey]: parsed };
          try { localStorage.setItem(LIVE_CACHE_STORAGE_KEY, JSON.stringify(updated)); } catch (e) {}
          return updated;
        });
        setShowPasteModal(false);
        setPasteInput("");
        setSelectedPeriodIndex(0);
        setLiveSourceStatus({
          type: 'verified',
          message: `Đã nạp & đối soát đủ 27 giải ngày ${formatDateVN(parseDateKey(parsed.dateKey))} từ xskt.com.vn`,
          lastSync: `Đã lưu bộ nhớ trình duyệt`
        });
      };

      const todayForecast = useMemo(() => generateDailyCuuTinhForecast(currentTime, historyData), [todayDateKey, historyData]);

      const drawStatus = useMemo(() => {
        const totalMinutes = currentTime.getHours() * 60 + currentTime.getMinutes();
        const lockMinutes = 18 * 60, startMinutes = 18 * 60 + 15, endMinutes = 18 * 60 + 35;
        if (totalMinutes < lockMinutes) {
          const diff = lockMinutes - totalMinutes;
          return { stage: 'locked_soon', badge: 'ĐÃ CHỐT SỐ HÔM NAY', color: 'text-amber-400 bg-amber-500/10 border-amber-500/30', countdown: `${Math.floor(diff / 60) > 0 ? `${Math.floor(diff / 60)}h ` : ''}${diff % 60}p nữa đến 18h00` };
        } else if (totalMinutes < startMinutes) {
          return { stage: 'waiting_draw', badge: 'ĐÃ KHÓA SỐ CHỜ QUAY', color: 'text-cyan-400 bg-cyan-500/10 border-cyan-500/30', countdown: `${startMinutes - totalMinutes} phút nữa mở thưởng` };
        } else if (totalMinutes <= endMinutes) {
          return { stage: 'drawing_live', badge: 'LIVE QUAY THƯỞNG', color: 'text-emerald-400 bg-emerald-500/15 border-emerald-500/40 animate-pulse', countdown: 'Đang đối soát lồng cầu' };
        } else {
          return { stage: 'finished', badge: 'ĐÃ ĐỐI SOÁT XSKT', color: 'text-purple-400 bg-purple-500/10 border-purple-500/30', countdown: '00:00 cập nhật kỳ hôm nay vào thống kê' };
        }
      }, [currentTime]);

      const handleCopyTodaySet = () => {
        const text = `🎯 BỘ SỐ CỬU TINH XSMB HÔM NAY (${todayForecast.date} - ${todayForecast.dayOfWeek}):\n` +
          `✦ Bạch Thủ Lô: ${todayForecast.btl}\n✦ Song Thủ Lô: ${todayForecast.stl.join(' - ')}\n✦ Tam Thủ Lô: ${todayForecast.ttl.join(' - ')}\n✦ Dàn 3 Càng 6 Số: ${todayForecast.threeClawSix.join(', ')}\n✦ Đài Mở Thưởng: ${todayForecast.province} (${todayForecast.ganZhi})\n✦ Thuyết Cửu Tinh: ${todayForecast.explanation}\nNguồn: XSMB Cửu Tinh Analytics Live xskt.com.vn`;
        const textArea = document.createElement("textarea");
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand("copy");
        document.body.removeChild(textArea);
        setCopiedToday(true);
        setTimeout(() => setCopiedToday(false), 2500);
      };

      const currentPeriod = useMemo(() => historyData[selectedPeriodIndex] || historyData[0], [historyData, selectedPeriodIndex]);
      const currentLuoShuChart = useMemo(() => calculateLuoShuChart(currentPeriod.centerStar, currentPeriod.isDuongDon), [currentPeriod]);
      const activeVerification = useMemo(() => verifyPredictionAgainstLive(currentPeriod.cuuTinhPick, currentPeriod.prizes), [currentPeriod]);
      const evaluatedHistory = useMemo(() => historyData.slice(0, verifyWindow).map(period => ({ ...period, verification: verifyPredictionAgainstLive(period.cuuTinhPick, period.prizes) })), [historyData, verifyWindow]);

      const performanceStats = useMemo(() => {
        const totalPeriods = evaluatedHistory.length;
        const winPeriods = evaluatedHistory.filter(p => p.verification.isWin).length;
        const winRate = totalPeriods > 0 ? ((winPeriods / totalPeriods) * 100).toFixed(1) : "0.0";
        const totalHits = evaluatedHistory.reduce((acc, curr) => acc + curr.verification.totalHits, 0);
        let streak = 0;
        for (let i = 0; i < evaluatedHistory.length; i++) { if (evaluatedHistory[i].verification.isWin) streak++; else break; }
        const btlWinPeriods = evaluatedHistory.filter(p => p.verification.btl.isWin).length;
        const btlWinRate = totalPeriods > 0 ? ((btlWinPeriods / totalPeriods) * 100).toFixed(1) : "0.0";
        const btlTotalHits = evaluatedHistory.reduce((acc, curr) => acc + curr.verification.btl.hits, 0);
        const stlWinPeriods = evaluatedHistory.filter(p => p.verification.stl.isWin).length;
        const stlWinRate = totalPeriods > 0 ? ((stlWinPeriods / totalPeriods) * 100).toFixed(1) : "0.0";
        const stlTotalHits = evaluatedHistory.reduce((acc, curr) => acc + curr.verification.stl.totalHits, 0);
        const ttlWinPeriods = evaluatedHistory.filter(p => p.verification.ttl.isWin).length;
        const ttlLosePeriods = totalPeriods - ttlWinPeriods;
        const ttlWinRate = totalPeriods > 0 ? ((ttlWinPeriods / totalPeriods) * 100).toFixed(1) : "0.0";
        const ttlTotalHits = evaluatedHistory.reduce((acc, curr) => acc + curr.verification.ttl.totalHits, 0);
        let ttlStreak = 0;
        for (let i = 0; i < evaluatedHistory.length; i++) { if (evaluatedHistory[i].verification.ttl.isWin) ttlStreak++; else break; }
        const recentTtlHits = evaluatedHistory.filter(p => p.verification.ttl.isWin).slice(0, 4).map(p => ({ date: p.date.slice(0, 5), hits: p.verification.ttl.list.filter(item => item.hits > 0) }));
        return {
          totalPeriods, winPeriods, winRate, totalHits, streak,
          btl: { winPeriods: btlWinPeriods, winRate: btlWinRate, totalHits: btlTotalHits },
          stl: { winPeriods: stlWinPeriods, winRate: stlWinRate, totalHits: stlTotalHits },
          ttl: { winPeriods: ttlWinPeriods, losePeriods: ttlLosePeriods, winRate: ttlWinRate, totalHits: ttlTotalHits, streak: ttlStreak, recentHits: recentTtlHits }
        };
      }, [evaluatedHistory]);

      const frequencyStats = useMemo(() => {
        const statsMap = {};
        for (let i = 0; i < 100; i++) {
          const numStr = i.toString().padStart(2, '0');
          const starId = ((i % 9) + 1);
          const star = STAR_CATALOG[starId];
          statsMap[numStr] = { number: numStr, starId, starName: star.name.split(" ")[0] + " " + star.name.split(" ")[1], element: star.element, nature: star.nature, luckStatus: star.luckStatus, count10: 0, count20: 0, count30: 0, lastSeenPeriod: -1 };
        }
        historyData.forEach((period, pIndex) => {
          parse27Prizes(period.prizes).loto2DList.forEach(num => {
            if (statsMap[num]) {
              if (pIndex < 10) statsMap[num].count10 += 1;
              if (pIndex < 20) statsMap[num].count20 += 1;
              if (pIndex < 30) statsMap[num].count30 += 1;
              if (statsMap[num].lastSeenPeriod === -1) statsMap[num].lastSeenPeriod = pIndex;
            }
          });
        });
        const maxAvailable = historyData.length;
        return Object.values(statsMap).map(item => {
          const gan = item.lastSeenPeriod === -1 ? maxAvailable : item.lastSeenPeriod;
          const count = activeCycle === 10 ? item.count10 : activeCycle === 20 ? item.count20 : item.count30;
          const isAuspiciousStar = item.starId === 9 || item.starId === 8 || item.starId === 1 || item.starId === 6;
          const baseProb = Math.min(97.8, Math.max(16.5, ((count * (activeCycle === 10 ? 17.8 : activeCycle === 20 ? 9.2 : 6.4)) + (12 - Math.min(12, gan) * 1.1)) * (isAuspiciousStar ? 1.25 : 0.95)));
          return { ...item, currentCount: count, gan, prob: Number(baseProb.toFixed(1)) };
        }).sort((a, b) => b.prob - a.prob);
      }, [historyData, activeCycle]);

      const filteredFrequencyStats = useMemo(() => {
        if (!searchNumber.trim()) return frequencyStats;
        return frequencyStats.filter(item => item.number.includes(searchNumber.trim()));

                      <div className="text-2xl sm:text-3xl font-black font-mono text-purple-400 mt-1">{performanceStats.ttl.winRate}%</div>
                      <span className="text-[11px] text-emerald-400 font-medium">Trung bình {(performanceStats.ttl.totalHits / Math.max(1, performanceStats.totalPeriods)).toFixed(2)} nháy/kỳ</span>
                    </div>
                    <div className="rounded-xl bg-slate-950/80 border border-purple-500/25 p-3.5">
                      <span className="text-[11px] text-slate-400 block">Số Kỳ Thắng / Thua TTL</span>
                      <div className="text-2xl sm:text-3xl font-black font-mono mt-1 flex items-center gap-2">
                        <span className="text-emerald-400">{performanceStats.ttl.winPeriods}T</span><span className="text-slate-600 text-lg">-</span><span className="text-rose-400">{performanceStats.ttl.losePeriods}B</span>
                      </div>
                      <span className="text-[11px] text-slate-500">Trên tổng số {performanceStats.totalPeriods} kỳ mở thưởng</span>
                    </div>
                    <div className="rounded-xl bg-slate-950/80 border border-purple-500/25 p-3.5">
                      <span className="text-[11px] text-slate-400 block">Tổng Nháy Tam Thủ Lô</span>
                      <div className="text-2xl sm:text-3xl font-black font-mono text-purple-300 mt-1">{performanceStats.ttl.totalHits} nháy</div>
                      <span className="text-[11px] text-slate-500">Chiếm {performanceStats.totalHits > 0 ? ((performanceStats.ttl.totalHits / performanceStats.totalHits) * 100).toFixed(0) : 0}% tổng nháy toàn hệ thống</span>
                    </div>
                    <div className="rounded-xl bg-slate-950/80 border border-purple-500/25 p-3.5">
                      <span className="text-[11px] text-slate-400 block mb-1.5">Các Số TTL Nổ Gần Nhất</span>
                      {performanceStats.ttl.recentHits.length > 0 ? (
                        <div className="flex flex-wrap gap-1.5 font-mono text-[11px]">
                          {performanceStats.ttl.recentHits.map((entry, idx) => (
                            <span key={idx} className="px-2 py-0.5 rounded bg-purple-500/20 border border-purple-400/40 text-purple-200 font-bold">{entry.date}: {entry.hits.map(h => `${h.number}(${h.hits}n)`).join(', ')}</span>
                          ))}
                        </div>
                      ) : <span className="text-xs text-slate-500 italic">Chưa có dữ liệu nổ</span>}
                    </div>
                  </div>
                </div>

                <div className="overflow-x-auto rounded-2xl border border-slate-800 bg-[#070c18] shadow-2xl">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-900/90 text-[11px] uppercase tracking-wider text-slate-400 font-semibold border-b border-slate-800">
                      <tr>
                        <th className="py-3.5 px-4">Ngày / Đài Quay</th><th className="py-3.5 px-4">Sao Cửu Tinh & Can Chi</th><th className="py-3.5 px-4">Bộ Số Cửu Tinh (BTL / STL)</th>
                        <th className="py-3.5 px-4">Tam Thủ Lô (TTL)</th><th className="py-3.5 px-4">Dàn 3 Càng (6 Số)</th><th className="py-3.5 px-4 text-center">GĐB Thực Tế</th>
                        <th className="py-3.5 px-4 text-center">Tổng Nháy</th><th className="py-3.5 px-4 text-center">Kết Quả</th><th className="py-3.5 px-4">Chi Tiết Trúng Thưởng</th><th className="py-3.5 px-4 text-right">Xem Cửu Tinh</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60 font-sans">
                      {evaluatedHistory.map((item, idx) => {
                        const { verification, cuuTinhPick } = item;
                        return (
                          <tr key={item.periodId} className={`hover:bg-slate-800/40 transition-colors ${selectedPeriodIndex === idx ? 'bg-amber-500/10 border-l-2 border-amber-400' : ''}`}>
                            <td className="py-3.5 px-4">
                              <div className="flex items-center gap-1.5">
                                <span className="font-bold text-white">{item.date}</span>
                                {idx === 0 && <span className="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-mono font-bold">Mới nhất</span>}
                              </div>
                              <span className="text-[11px] text-slate-500">{item.dayOfWeek} • {item.province}</span>
                            </td>
                            <td className="py-3.5 px-4">
                              <span className="text-xs text-amber-200/90 font-medium block">{STAR_CATALOG[item.centerStar].name.split(" ")[0]} {STAR_CATALOG[item.centerStar].name.split(" ")[1]}</span>
                              <span className="text-[10px] text-cyan-300 font-mono">{item.ganZhi}</span>
                            </td>
                            <td className="py-3.5 px-4">
                              <div className="flex flex-wrap items-center gap-1.5 font-mono text-xs">
                                <span className={`px-2 py-0.5 rounded border ${verification.btl.isWin ? 'bg-amber-500 text-slate-950 font-black border-amber-400' : 'bg-slate-900 border-slate-800 text-amber-300'}`}>BTL: {cuuTinhPick.btl}</span>
                                <span className={`px-2 py-0.5 rounded border ${verification.stl.isWin ? 'bg-cyan-500 text-slate-950 font-bold border-cyan-400' : 'bg-slate-900 border-slate-800 text-cyan-300'}`}>STL: {cuuTinhPick.stl.join(', ')}</span>
                              </div>
                            </td>
                            <td className="py-3.5 px-4">
                              <div className="flex flex-wrap items-center gap-1 font-mono text-xs">
                                {verification.ttl.list.map((ttlItem, tIdx) => (
                                  <span key={tIdx} className={`px-2 py-0.5 rounded border ${ttlItem.hits > 0 ? 'bg-purple-500 text-white font-bold border-purple-300 shadow-sm' : 'bg-slate-900 border-slate-800 text-purple-300/80'}`}>{ttlItem.number}{ttlItem.hits > 0 ? `(${ttlItem.hits}n)` : ''}</span>
                                ))}
                              </div>
                            </td>
                            <td className="py-3.5 px-4">
                              <div className="flex flex-wrap gap-1 font-mono text-[11px]">
                                {cuuTinhPick.threeClawSix.map((c, cIdx) => {
                                  const isHit = c === verification.analysis.special3D;
                                  return <span key={cIdx} className={`px-1.5 py-0.5 rounded border ${isHit ? 'bg-rose-500 text-white font-black border-rose-300 animate-pulse' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>{c}</span>;
                                })}
                              </div>
                            </td>
                            <td className="py-3.5 px-4 text-center font-mono"><span className="font-black text-rose-400 bg-rose-500/10 px-2 py-0.5 rounded border border-rose-500/30">{item.prizes.db}</span></td>
                            <td className="py-3.5 px-4 text-center font-mono font-bold"><span className={`px-2 py-0.5 rounded ${verification.totalHits > 0 ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'text-slate-500'}`}>{verification.totalHits} nháy</span></td>
                            <td className="py-3.5 px-4 text-center">
                              {verification.isWin ? (
                                <span className="inline-flex items-center text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2.5 py-0.5 rounded-full border border-emerald-500/30"><Icon name="checkCircle2" className="w-3.5 h-3.5 mr-1" /> Thắng</span>
                              ) : (
                                <span className="inline-flex items-center text-xs font-bold text-rose-400 bg-rose-500/10 px-2.5 py-0.5 rounded-full border border-rose-500/30"><Icon name="xCircle" className="w-3.5 h-3.5 mr-1" /> Thua</span>
                              )}
                            </td>
                            <td className="py-3.5 px-4">
                              <div className="text-xs space-y-0.5">
                                {verification.btl.isWin && <div className="text-amber-400 font-semibold">• BTL {cuuTinhPick.btl} nổ {verification.btl.hits} nháy</div>}
                                {verification.stl.isWin && <div className="text-cyan-400">• STL ăn {verification.stl.totalHits} nháy ({verification.stl.list.filter(s => s.hits > 0).map(s => `${s.number}:${s.hits}`).join(', ')})</div>}
                                {verification.ttl.isWin && <div className="text-purple-400 font-semibold">• TTL ăn {verification.ttl.totalHits} nháy ({verification.ttl.list.filter(t => t.hits > 0).map(t => `${t.number}:${t.hits}`).join(', ')})</div>}
                                {verification.threeClaw.isWin && <div className="text-rose-400 font-bold">• NỔ 3 CÀNG {verification.threeClaw.matches.join(', ')}</div>}
                                {!verification.isWin && <span className="text-slate-500 italic">Không nổ số nào trong 27 giải</span>}
                              </div>
                            </td>
                            <td className="py-3.5 px-4 text-right">
                              <button onClick={() => { setSelectedPeriodIndex(idx); setActiveTab('cuuTinh'); }} className="text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700 font-medium transition-all">Xem Tinh Đồ</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </section>
            )}

            {activeTab === 'stats' && (
              <section className="space-y-5">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div>
                    <h3 className="text-lg font-bold text-white flex items-center gap-2"><Icon name="barChart3" className="w-5 h-5 text-cyan-400" />Xếp Hạng Điểm Cửu Tinh & Tần Suất (00 - 99)</h3>
                    <p className="text-xs text-slate-400">Tổng hợp từ {Math.min(activeCycle, historyData.length)}/{activeCycle} kỳ thật từ xskt.com.vn tính đến ngày <strong className="text-amber-300">{latestPeriod.date}</strong></p>
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <div className="inline-flex rounded-xl bg-slate-900 p-1 border border-slate-800">
                      {[10, 20, 30].map(cycle => (
                        <button key={cycle} onClick={() => setActiveCycle(cycle)} className={`px-3 py-1.5 text-xs font-bold rounded-lg transition-all ${activeCycle === cycle ? 'bg-amber-400 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'}`}>{cycle} kỳ</button>
                      ))}
                    </div>
                    <div className="relative">
                      <Icon name="search" className="w-4 h-4 text-slate-400 absolute left-3 top-2.5" />
                      <input type="text" maxLength={2} placeholder="Tra số 00-99..." value={searchNumber} onChange={(e) => setSearchNumber(e.target.value.replace(/\D/g, ''))} className="w-36 pl-9 pr-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-400 font-mono" />
                    </div>
                  </div>
                </div>

                <div className="overflow-x-auto rounded-2xl border border-slate-800 bg-[#070c18] shadow-2xl">
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-900/90 text-[11px] uppercase tracking-wider text-slate-400 font-semibold border-b border-slate-800">
                      <tr>
                        <th className="py-3 px-4 text-center w-14">Hạng</th><th className="py-3 px-4">Số Lô (00-99)</th><th className="py-3 px-4">Sao Cung Mệnh</th><th className="py-3 px-4">Tính Chất Ngũ Hành</th>
                        <th className="py-3 px-4 text-center">Tần Suất ({Math.min(activeCycle, historyData.length)} kỳ)</th><th className="py-3 px-4 text-center">Kỳ Gan</th><th className="py-3 px-4 text-center">Đánh Giá Tinh Khí</th><th className="py-3 px-4 text-right">Điểm Cửu Tinh</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60 font-sans">
                      {filteredFrequencyStats.slice(0, 15).map((row, index) => (
                        <tr key={row.number} className="hover:bg-slate-800/40 transition-colors">
                          <td className="py-3 px-4 text-center font-mono font-bold text-slate-400">{index + 1}</td>
                          <td className="py-3 px-4"><span className="text-xl font-black font-mono text-white">{row.number}</span></td>
                          <td className="py-3 px-4 text-xs text-slate-300 font-medium">{row.starName}</td>
                          <td className="py-3 px-4 text-xs text-slate-400">{row.nature} ({row.element})</td>
                          <td className="py-3 px-4 text-center font-mono font-bold text-cyan-300">{row.currentCount} lần</td>
                          <td className="py-3 px-4 text-center font-mono"><span className={`px-2 py-0.5 rounded text-xs font-bold ${row.gan >= 6 ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-300'}`}>{row.gan} kỳ</span></td>
                          <td className="py-3 px-4 text-center">
                            {row.starId === 9 || row.starId === 8 ? (
                              <span className="inline-flex items-center text-[10px] font-bold text-amber-300 bg-amber-500/10 border border-amber-500/30 px-2 py-0.5 rounded-full"><Icon name="flame" className="w-3 h-3 mr-1 text-amber-400" /> Đương Lệnh Vượng</span>
                            ) : row.starId === 1 || row.starId === 6 ? (
                              <span className="inline-flex items-center text-[10px] font-bold text-cyan-300 bg-cyan-500/10 border border-cyan-500/30 px-2 py-0.5 rounded-full"><Icon name="trendingUp" className="w-3 h-3 mr-1" /> Tiến Khí Cát</span>
                            ) : <span className="text-slate-500 text-xs">{row.luckStatus}</span>}
                          </td>
                          <td className="py-3 px-4 text-right font-mono font-black text-amber-400 text-base">{row.prob}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            )}
          </main>

          {showPasteModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-[#070c18] border border-amber-500/40 rounded-3xl max-w-xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2"><Icon name="clipboardPaste" className="w-5 h-5 text-amber-400" /><h3 className="text-base font-bold text-white">Nạp & Đối Soát Live 27 Giải từ xskt.com.vn</h3></div>
                  <button onClick={() => setShowPasteModal(false)} className="text-slate-400 hover:text-white p-1.5 rounded-lg bg-slate-900 border border-slate-800">✕</button>
                </div>
                <div className="space-y-3 text-xs text-slate-300">
                  <p>1. Mở trang <a href="https://xskt.com.vn/xsmb" target="_blank" rel="noreferrer" className="text-cyan-300 underline font-bold">xskt.com.vn/xsmb</a>, bôi đen bảng kết quả ngày <strong className="text-amber-300">{yesterdayDateStr}</strong> (từ dòng ngày / ĐB đến hết Giải 7) và nhấn <strong>Copy</strong>.</p>
                  <p>2. Dán vào ô bên dưới — hệ thống tự động nhận diện ngày và tách chính xác đủ <strong>27 giải</strong> (không bao giờ dùng số giả):</p>
                  <textarea rows={6} value={pasteInput} onChange={(e) => setPasteInput(e.target.value)} placeholder={`Ví dụ dán nội dung copy từ xskt.com.vn/xsmb ngày ${yesterdayDateStr}...`} className="w-full rounded-xl bg-slate-950 border border-slate-700 p-3 text-xs font-mono text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400" />
                  {pasteError && <div className="p-2.5 rounded-xl bg-rose-950/60 border border-rose-500/40 text-rose-300 text-[11px]">{pasteError}</div>}
                </div>
                <div className="flex items-center justify-end gap-2 pt-2">
                  <button onClick={() => setShowPasteModal(false)} className="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 font-bold text-xs border border-slate-800">Hủy</button>
                  <button onClick={handleManualPasteSubmit} className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow-lg shadow-amber-500/20">Xác Nhận & Cập Nhật 27 Giải</button>
                </div>
              </div>
            </div>
          )}

          {showExplanationModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-[#070c18] border border-slate-800 rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2"><Icon name="compass" className="w-5 h-5 text-amber-400" /><h3 className="text-base font-bold text-white">Thuyết Cửu Tinh Đồ Lấy Số Học Miền Bắc</h3></div>
                  <button onClick={() => setShowExplanationModal(false)} className="text-slate-400 hover:text-white p-1.5 rounded-lg bg-slate-900 border border-slate-800">✕</button>
                </div>
                <div className="space-y-3 text-xs text-slate-300 leading-relaxed max-h-[70vh] overflow-y-auto pr-1">
                  <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800 space-y-1">
                    <strong className="text-amber-300 block">1. Cửu Tinh Quản Nhật & Quỹ Đạo Âm / Dương Độn:</strong>
                    <p>Dựa vào tiết khí (Đông Chí đến Hạ Chí: Dương Độn bay thuận 1-9; Hạ Chí đến Đông Chí: Âm Độn bay nghịch 9-1) kết hợp Lục Thập Hoa Giáp ngày quay thưởng để xác định Sao Nhập Trung Cung.</p>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800 space-y-1">
                    <strong className="text-cyan-300 block">2. Cơ Chế Lập Bạch Thủ Lô, Song Thủ Lô & Tam Thủ Lô:</strong>
                    <p>- <strong>Bạch Thủ Lô (BTL):</strong> Chọn con số có Điểm Cửu Tinh cao nhất từ Cung Sinh Khí (Cửu Tử - Bát Bạch) trùng chu kỳ nhịp rơi thực tế của 27 giải xskt.</p>
                    <p>- <strong>Song Thủ Lô (STL):</strong> Cặp số đối xứng Âm Dương hoặc mẹ con Ngũ Hành của trục cung quản trị.</p>
                    <p>- <strong>Tam Thủ Lô (TTL):</strong> Bộ 3 số Tam Hợp Địa Chi quy tụ sinh khí từ 3 cung cát tinh trong ngày.</p>
                  </div>
                  <div className="p-3 rounded-xl bg-slate-900/60 border border-slate-800 space-y-1">
                    <strong className="text-rose-300 block">3. Nguyên Tắc Dữ Liệu Thật 100% Từ xskt.com.vn:</strong>
                    <p>Hệ thống tự động đồng bộ RSS và HTML trực tiếp từ <code>xskt.com.vn</code> qua đa luồng proxy đến kỳ ngày hôm qua (<code>T-1</code>) lúc <code>00:00</code> mỗi ngày và lưu trữ cục bộ, tuyệt đối không dùng số giả lập.</p>
                  </div>
                </div>
                <div className="pt-2 text-right">
                  <button onClick={() => setShowExplanationModal(false)} className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs">Đã Hiểu</button>
                </div>
              </div>
            </div>
          )}

          <footer className="mt-12 border-t border-slate-800 bg-[#02050c] py-6 text-center text-xs text-slate-500 px-4">
            <p className="font-medium text-slate-400">
              XSMB Cửu Tinh Analytics • Ứng dụng Huyền Không Phi Tinh & Lạc Thư Ma Phương kết hợp đối soát 27 giải thực tế từ <a href="https://xskt.com.vn/xsmb" target="_blank" rel="noreferrer" className="text-amber-400 hover:underline">xskt.com.vn</a>
            </p>
            <p className="text-[11px] text-slate-600 mt-1">Tự động cập nhật kỳ mới nhất đến ngày hôm qua ({yesterdayDateStr}) sau mỗi ngày.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
